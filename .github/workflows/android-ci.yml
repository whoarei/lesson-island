name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk-artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check version and release tag
        id: version
        run: python3 tools/ci_check.py version

      - name: Test CI guards
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: Build unsigned APKs, run unit tests and lint
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace -PciUnsigned=true
          :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest
          :app:lintDebug :app:lintRelease :app:compileDebugAndroidTestJavaWithJavac

      - name: Verify release APK and prepare checksums
        env:
          CI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tools/ci_check.py apk "$apk"
          mkdir -p build/ci-artifacts
          cp "$apk" "build/ci-artifacts/LessonIsland-${CI_VERSION}-unsigned.apk"
          cd build/ci-artifacts
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload unsigned check package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LessonIsland-${{ steps.version.outputs.version }}-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ci-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Sign APK and publish Release
    needs: checks
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI_VERSION: ${{ needs.checks.outputs.version }}
      PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up signing tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Download the APK checked by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.checks.outputs.apk-artifact-id }}
          path: build/release-input

      - name: Check the downloaded artifact
        working-directory: build/release-input
        run: sha256sum --check SHA256SUMS.txt

      - name: Sign, verify and package release files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 -B tools/github_release.py prepare
          "build/release-input/LessonIsland-${CI_VERSION}-unsigned.apk"
          build/github-release

      - name: Publish verified files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/github_release.py publish build/github-release
