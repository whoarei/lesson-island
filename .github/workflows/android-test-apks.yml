name: Signed device test APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-test-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build signed APKs for offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build application and instrumentation APKs
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace -PciUnsigned=true
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Sign with the existing user certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 -B tools/test_apks.py sign build/device-test-apks

      - name: Upload private test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-test-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/device-test-apks/
          if-no-files-found: error
          retention-days: 3
